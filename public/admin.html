<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Quản trị – NHỊP</title><link rel="stylesheet" href="/style.css">
<style>.tabs{display:flex;gap:8px;margin:16px 0}td input{width:64px;padding:6px;border:1px solid var(--line);border-radius:6px}.ord{margin-bottom:12px}select{padding:7px;border-radius:8px;border:1px solid var(--line);font:inherit}</style></head><body>
<header class="hdr"><div class="wrap hrow"><a href="/" class="logo">NHỊP<span>.</span></a><b style="flex:1">Quản trị</b><button class="btn ghost" id="lo" style="padding:7px 14px;display:none">Đăng xuất</button></div></header>
<main class="wrap" id="app"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app'),vnd=n=>n.toLocaleString('vi-VN')+'đ',esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const ST={cho_xac_nhan:'Chờ xác nhận',da_xac_nhan:'Đã xác nhận',dang_giao:'Đang giao',hoan_thanh:'Hoàn thành',da_huy:'Đã huỷ'};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000)};
const api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o,body:o.body&&JSON.stringify(o.body)});const j=await r.json().catch(()=>({}));if(r.status===401&&!u.includes('login')){login();throw new Error('auth')}if(!r.ok)throw new Error(j.error||'Lỗi');return j};
function login(){$('#lo').style.display='none';app.innerHTML=`<form class="box" id="lf" style="max-width:380px;margin:60px auto"><h2 style="margin-top:0">Đăng nhập quản trị</h2><input type="password" name="pw" placeholder="Mật khẩu" style="width:100%;padding:12px;border:1.5px solid var(--line);border-radius:10px;font:inherit" autofocus><div id="er"></div><button class="btn block" style="margin-top:12px">Đăng nhập</button></form>`;
 $('#lf').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{method:'POST',body:{password:e.target.pw.value}});orders()}catch(x){$('#er').innerHTML=`<div class="err">${esc(x.message)}</div>`}}}
const tabs=a=>`<div class="tabs"><button class="chip ${a==0?'on':''}" onclick="orders()">Đơn hàng</button><button class="chip ${a==1?'on':''}" onclick="stock()">Tồn kho</button></div>`;
let filter='';
async function orders(){const os=await api('/api/admin/orders');$('#lo').style.display='';const f=os.filter(o=>!filter||o.status===filter);
 const rev=os.filter(o=>o.status!=='da_huy').reduce((a,o)=>a+o.total,0);
 app.innerHTML=tabs(0)+`<div class="usp" style="margin:10px 0"><div><b>${os.length}</b><span>Tổng đơn</span></div><div><b>${os.filter(o=>o.status==='cho_xac_nhan').length}</b><span>Chờ xác nhận</span></div><div><b>${vnd(rev)}</b><span>Doanh thu (trừ huỷ)</span></div><div><b>${os.filter(o=>o.payment==='bank'&&!o.paid&&o.status!=='da_huy').length}</b><span>CK chưa nhận tiền</span></div></div>
 <select id="fl"><option value="">Tất cả trạng thái</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===filter?'selected':''}>${v}</option>`).join('')}</select><div style="margin-top:12px">${f.length?f.map(o=>`<div class="box ord"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><div><b>${o.code}</b> · ${new Date(o.createdAt).toLocaleString('vi-VN')}<div class="meta">${esc(o.customer.name)} · ${esc(o.customer.phone)} · ${esc(o.customer.address)}, ${esc(o.customer.ward)}, ${esc(o.customer.province)}</div>${o.customer.note?`<div class="meta">📝 ${esc(o.customer.note)}</div>`:''}</div>
 <div style="text-align:right"><b class="price">${vnd(o.total)}</b><div class="meta">${o.payment==='cod'?'COD':'Chuyển khoản'}${o.discountCode?' · '+esc(o.discountCode):''}</div></div></div>
 <div class="meta" style="margin:8px 0">${o.lines.map(l=>`${esc(l.name)} (${esc(l.color)}, ${l.size}) ×${l.qty}`).join(' · ')}</div>
 <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select data-o="${o.code}" ${o.status==='da_huy'?'disabled':''}>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${k===o.status?'selected':''}>${v}</option>`).join('')}</select>${o.payment==='bank'?`<label><input type="checkbox" data-p="${o.code}" ${o.paid?'checked':''}> Đã nhận tiền</label>`:''}</div></div>`).join(''):'<p class="meta">Chưa có đơn.</p>'}</div>`;
 $('#fl').onchange=e=>{filter=e.target.value;orders()};
 document.querySelectorAll('[data-o]').forEach(s=>s.onchange=async()=>{if(s.value==='da_huy'&&!confirm('Huỷ đơn và hoàn lại tồn kho?'))return orders();try{await api('/api/admin/orders/'+s.dataset.o,{method:'PATCH',body:{status:s.value}});toast('Đã cập nhật');orders()}catch(e){toast(e.message)}});
 document.querySelectorAll('[data-p]').forEach(c=>c.onchange=async()=>{await api('/api/admin/orders/'+c.dataset.p,{method:'PATCH',body:{paid:c.checked}});toast('Đã cập nhật')})}
const CATN={sneaker:'Sneaker','chay-bo':'Chạy bộ','giay-da':'Giày da',sandal:'Sandal','the-thao':'Thể thao',boot:'Boot',dep:'Dép','giay-luoi':'Giày lười','tre-em':'Trẻ em'};
const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
let SF={q:'',cat:'',low:''},SP=null;
async function stock(){SP=await api('/api/admin/stock');$('#lo').style.display='';
 app.innerHTML=tabs(1)+`<div class="box" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input id="aq" type="search" placeholder="Tìm tên / mã / màu…" value="${esc(SF.q)}" style="flex:1;min-width:180px;padding:10px;border:1.5px solid var(--line);border-radius:10px;font:inherit"><select id="ac" style="padding:10px;border-radius:10px;font:inherit"><option value="">Mọi dòng</option>${Object.entries(CATN).map(([k,v])=>`<option value="${k}" ${SF.cat==k?'selected':''}>${v}</option>`).join('')}</select><label><input type="checkbox" id="al" ${SF.low?'checked':''}> Có size hết hàng</label><span class="meta" id="an"></span></div><div id="sl"></div>`;
 $('#aq').oninput=e=>{SF.q=e.target.value;drawStock()};$('#ac').onchange=e=>{SF.cat=e.target.value;drawStock()};$('#al').onchange=e=>{SF.low=e.target.checked?'1':'';drawStock()};drawStock()}
function drawStock(){const q=fold(SF.q).trim();const ps=SP.filter(p=>(!SF.cat||p.cat===SF.cat)&&(!q||fold(p.name+' #'+p.id+' '+p.slug+' '+p.colors.join(' ')).includes(q))&&(!SF.low||p.colors.some(c=>p.sizes.some(s=>p.stock[c][s]==0))));
 $('#an').textContent=ps.length+' / '+SP.length+' sản phẩm';
 $('#sl').innerHTML=ps.map(p=>`<div class="box ord"><b>#${p.id} ${esc(p.name)}</b> <span class="meta">· ${CATN[p.cat]||p.cat} · tổng ${p.total} đôi</span>${p.colors.map(c=>`<div style="overflow-x:auto"><table class="st"><tr><th>${esc(c)}</th>${p.sizes.map(s=>`<th>${s}</th>`).join('')}</tr><tr><td></td>${p.sizes.map(s=>`<td><input type="number" min="0" value="${p.stock[c][s]}" data-id="${p.id}" data-c="${esc(c)}" data-s="${s}" aria-label="${esc(p.name)} ${esc(c)} size ${s}" style="${p.stock[c][s]==0?'background:#fee2e2':''}"></td>`).join('')}</tr></table></div>`).join('')}</div>`).join('')||'<div class="box">Không có sản phẩm khớp</div>';
 document.querySelectorAll('#sl input[data-id]').forEach(i=>i.onchange=async()=>{try{await api('/api/admin/stock',{method:'PUT',body:{id:+i.dataset.id,color:i.dataset.c,size:+i.dataset.s,qty:+i.value}});const p=SP.find(x=>x.id==i.dataset.id);p.stock[i.dataset.c][i.dataset.s]=+i.value;i.style.background=i.value==0?'#fee2e2':'#dcfce7';toast('Đã lưu tồn kho')}catch(e){toast(e.message)}})}
$('#lo').onclick=async()=>{await api('/api/admin/logout',{method:'POST'});login()};
orders().catch(()=>{});
</script></body></html>
